name: Refresh feed and deploy

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub's scheduler is best-effort; expect 5–15 min lag
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull hc911 + news into data/
        run: python3 scripts/fetch_data.py --out data

      - name: Commit if the data changed
        run: |
          git config user.name  "hc911-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --quiet --cached; then
            echo "no change"
          else
            git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            # Overlapping triggers (schedule + manual dispatch) can race here;
            # rebase onto whatever landed first and retry once.
            git push || { git pull --rebase --autostash && git push; }
          fi

      - uses: actions/configure-pages@v5

      - name: Stage the static site
        run: |
          mkdir -p _site
          cp index.html weather.html _site/
          cp -r assets data _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
