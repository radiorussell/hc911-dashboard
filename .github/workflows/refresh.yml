name: Refresh feed and deploy

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub's scheduler is best-effort; expect 5–15 min lag
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Pull hc911 + news into data/
        run: python3 scripts/fetch_data.py --out data

      - name: Commit if the data changed
        run: |
          git config user.name  "hc911-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --quiet --cached; then
            echo "no change"
          else
            git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            # Overlapping triggers (schedule + manual dispatch) can race here;
            # rebase onto whatever landed first and retry once.
            git push || { git pull --rebase --autostash && git push; }
          fi

      - uses: actions/configure-pages@v6

      - name: Stage the static site
        run: |
          mkdir -p _site
          # Root-level files are listed explicitly — Pages serves only _site/, so a
          # new root file (favicon.ico, site.webmanifest, ...) is invisible until
          # it is added here.
          cp index.html traffic.html weather.html favicon.ico site.webmanifest _site/
          cp -r assets data _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # Deploy from its own job, not a step after the upload. Deploying in the same
  # job looks the artifact up ~0.3s after it is finalized, and the artifacts API
  # sometimes has not indexed it yet: "Found 0 artifact(s)" -> run fails, Pages
  # keeps serving the previous build. Two runs died that way on 2026-11-21
  # (actions/deploy-pages#451). A separate job leaves the API a few seconds.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
